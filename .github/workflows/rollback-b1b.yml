name: One-shot rollback to b1b1 baseline

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Confirm restoring tracked repository content to b1b1cece baseline (current windows.yml/.gitignore/recompiled are preserved)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: one-shot-b1b1-rollback-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rollback:
    if: ${{ inputs.confirm }}
    runs-on: windows-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Restore tracked repository state to pinned baseline
        id: rollback
        shell: pwsh
        env:
          BASELINE_COMMIT: b1b1cece387a76722f0fd4e97bc953af6e37bfcd
        run: |
          $ErrorActionPreference = 'Stop'

          if ('${{ github.ref_type }}' -ne 'branch') {
            throw 'Run this workflow from a branch, not a tag.'
          }

          $branch = '${{ github.ref_name }}'
          $headBefore = (git rev-parse HEAD).Trim()
          git cat-file -e "$env:BASELINE_COMMIT^{commit}"
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned baseline commit $env:BASELINE_COMMIT is not available in fetched history."
          }

          Write-Host "Current branch : $branch"
          Write-Host "Current HEAD   : $headBefore"
          Write-Host "Baseline       : $env:BASELINE_COMMIT"
          Write-Host 'Preserving current:'
          Write-Host '  .github/workflows/windows.yml'
          Write-Host '  .github/workflows/rollback-b1b.yml'
          Write-Host '  .gitignore'
          Write-Host '  eboot_port/recompiled/**'

          # Restore the tracked tree exactly from the baseline. Paths absent in
          # the baseline are removed as well. The current private-EBOOT CI,
          # gitignore policy, this manual one-shot workflow, and generated PPU
          # output are deliberately excluded.
          git restore --source="$env:BASELINE_COMMIT" --staged --worktree -- `
            . `
            ':(exclude).github/workflows/windows.yml' `
            ':(exclude).github/workflows/rollback-b1b.yml' `
            ':(exclude).gitignore' `
            ':(exclude)eboot_port/recompiled/**'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Safety invariants: none of the preserved paths may be staged.
          $forbidden = @(git diff --cached --name-only -- `
            .github/workflows/windows.yml `
            .github/workflows/rollback-b1b.yml `
            .gitignore `
            eboot_port/recompiled)
          if ($forbidden.Count -gt 0) {
            throw "Rollback staged preserved path(s): $($forbidden -join ', ')"
          }

          $changed = @(git diff --cached --name-only)
          if ($changed.Count -eq 0) {
            Write-Host 'Working tree already matches the requested baseline for all rollback-managed paths.'
            "changed=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "branch=$branch" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "head_before=$headBefore" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          Write-Host "Staged rollback changes: $($changed.Count) file(s)"
          git diff --cached --stat
          git diff --cached --name-status | Select-Object -First 400

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Rollback tracked source to b1b1cece AV baseline"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $rollbackCommit = (git rev-parse HEAD).Trim()
          git push origin "HEAD:$branch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          "changed=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "branch=$branch" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "head_before=$headBefore" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "rollback_commit=$rollbackCommit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## b1b1 rollback pushed"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Previous HEAD: ``$headBefore``"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Baseline: ``$env:BASELINE_COMMIT``"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Rollback commit: ``$rollbackCommit``"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Branch: ``$branch``"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Files changed: $($changed.Count)"

      # Pushes authenticated with GITHUB_TOKEN intentionally do not fan out into
      # another ordinary push-triggered workflow. Dispatch the clean Windows CI
      # explicitly against the rollback commit instead. windows.yml itself has
      # no rollback stage.
      - name: Run normal Windows CI on rolled-back branch
        if: steps.rollback.outputs.changed == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run windows.yml --ref '${{ steps.rollback.outputs.branch }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'Dispatched normal windows.yml CI on the rolled-back branch.'
