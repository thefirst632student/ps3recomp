# Builds the runtime library on Windows, the only platform that can currently
# run a recompiled game.
#
# The macOS job guards the POSIX paths; this one guards the platform everything
# actually ships on. Without it, a change made to satisfy Clang could break the
# MSVC/clang-cl build and nothing would notice until someone tried to build a
# port -- which is the same class of drift that let docs/BUILDING.md advertise
# macOS support the tree did not have.
#
# clang-cl rather than plain cl: the loader uses __builtin_bswap* and weak
# symbols that MSVC does not provide (see docs/BUILDING.md).
name: Windows

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Windows x64 (${{ matrix.build_type }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4
        with:
          # v56 compares the freshly lifted output against the last generated
          # eboot_port/recompiled tree that existed in repository history.
          fetch-depth: 0

      # Puts cl, the Windows SDK and the MSVC headers on PATH. clang-cl needs
      # the MSVC headers even though it is doing the compiling, and the
      # conformance suite shells out to cl to build its generated driver.
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install build dependencies
        shell: pwsh
        run: |
          # Keep Ninja as the only Chocolatey fallback. Do not use
          # Chocolatey's ffmpeg-shared package: its metadata can carry a stale
          # checksum when the mutable gyan.dev release archive is refreshed.
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            choco install 7zip -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          # setup-ffmpeg actions are aimed at ffmpeg.exe/ffprobe.exe. In
          # particular FedericoCarboni/setup-ffmpeg@v3 caches only the archive's
          # bin directory, while the runtime build needs FFmpeg headers and MSVC
          # import libraries too. Download the same Gyan full shared package
          # directly and verify it with the checksum published alongside it.
          $baseUrl = "https://www.gyan.dev/ffmpeg/builds"
          $archiveUrl = "$baseUrl/ffmpeg-release-full-shared.7z"
          $checksumUrl = "$archiveUrl.sha256"
          $downloadDir = Join-Path $env:RUNNER_TEMP "ffmpeg-shared-download"
          $extractDir = Join-Path $env:RUNNER_TEMP "ffmpeg-shared"
          $archive = Join-Path $downloadDir "ffmpeg-release-full-shared.7z"
          $checksumFile = "$archive.sha256"

          New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null
          Remove-Item -Recurse -Force $extractDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null

          Invoke-WebRequest -Uri $archiveUrl -OutFile $archive
          Invoke-WebRequest -Uri $checksumUrl -OutFile $checksumFile

          $published = ((Get-Content $checksumFile -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $published) {
            throw "FFmpeg SHA-256 mismatch: expected $published, got $actual"
          }

          & 7z x $archive "-o$extractDir" -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $ffmpegRoot = Get-ChildItem -Path $extractDir -Directory |
            Where-Object {
              (Test-Path (Join-Path $_.FullName "include\libavcodec\avcodec.h")) -and
              (Test-Path (Join-Path $_.FullName "lib\avcodec.lib")) -and
              (Test-Path (Join-Path $_.FullName "bin"))
            } |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $ffmpegRoot) {
            throw "Could not locate extracted FFmpeg development root under $extractDir"
          }

          $required = @(
            "include\libavcodec\avcodec.h",
            "include\libavutil\avutil.h",
            "include\libswscale\swscale.h",
            "lib\avcodec.lib",
            "lib\avutil.lib",
            "lib\swscale.lib"
          )
          foreach ($rel in $required) {
            $path = Join-Path $ffmpegRoot $rel
            if (-not (Test-Path $path)) {
              throw "FFmpeg shared development package is incomplete: $path"
            }
          }

          $dlls = Get-ChildItem -Path (Join-Path $ffmpegRoot "bin") -Filter "*.dll"
          if (-not $dlls) {
            throw "FFmpeg shared package has no runtime DLLs in $ffmpegRoot\bin"
          }

          "PS3RECOMP_FFMPEG_ROOT=$ffmpegRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "FFmpeg development root: $ffmpegRoot"
          Write-Host "FFmpeg DLL count: $($dlls.Count)"

      - name: Show toolchain
        run: |
          clang-cl --version
          ninja --version
          cmake --version

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=clang-cl
          -DCMAKE_CXX_COMPILER=clang-cl
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DPS3RECOMP_REQUIRE_FFMPEG=ON
          -DPS3RECOMP_FFMPEG_ROOT="$env:PS3RECOMP_FFMPEG_ROOT"

      - name: Build
        run: cmake --build build

      - name: Verify the library exists
        shell: bash
        run: |
          ls -la build/ps3recomp_runtime.lib
          test -s build/ps3recomp_runtime.lib

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python tool dependencies
        run: python -m pip install -r tools/requirements.txt

      # The same eight suites the macOS job runs. The conformance one compiles
      # and EXECUTES 1300+ lifted instruction cases; CI=1 makes it fail rather
      # than skip if no compiler is reachable, because a green tick meaning
      # "compiled nothing" is worse than a red one.
      - name: Run the lifter test suites
        shell: bash
        env:
          CI: "1"
        run: |
          set -e
          for t in tools/test_*.py; do
            echo "--- $t"
            python "$t"
          done

      # runtime/ppu/ is the one part of the runtime no CMake target builds --
      # it needs the lifter's per-game ppu_recomp.h -- so it was only ever
      # compiled inside somebody's game port. Windows is where it works, so
      # this is a real gate here: the baseline is near zero and any new error
      # fails the job.
      - name: Check the PPU boot scaffold (ratchet)
        run: python tools/check_ppu_scaffold.py

      # RSX texture layout -- format class, row sizes, Morton addressing. Pure
      # Linux and macOS have run these since they were written; Windows never
      # did. That gap let a broken xswd case sit red on both POSIX runners
      # while Windows reported green, which is exactly the wrong way round for
      # the platform most contributors build on.
      - name: Run self-contained SPU helper tests
        run: |
          clang-cl /nologo /W0 /D_CRT_SECURE_NO_WARNINGS /I include /I runtime/spu /Fe:test_spu_helpers.exe runtime/spu/tests/test_spu_helpers.c
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\test_spu_helpers.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # arithmetic with no host API in it, so it runs everywhere, and it is the
      # regression net for having lifted that maths out of the D3D12 uploader.
      # sync_stress has always been the Windows-native suite; now that its
      # source also builds on POSIX through the shim, this is what proves the
      # shared source still means the same thing here.
      - name: Build and run sync_stress
        run: |
          cmake -S tests/sync_stress -B build-sync-stress -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_C_COMPILER=clang-cl
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build build-sync-stress
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ctest --test-dir build-sync-stress --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Run self-contained RSX tests
        # NOT shell: bash. Git Bash rewrites a leading-slash argument into a
        # Windows path, so /nologo arrived at the linker as an .obj under the
        # Git install directory. PowerShell leaves MSVC-style flags alone.
        run: |
          clang-cl /nologo /W0 /D_CRT_SECURE_NO_WARNINGS /I include /I libs/video /Fe:test_texture_layout.exe libs/video/tests/test_texture_layout.c libs/video/rsx_texture_layout.c
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\test_texture_layout.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          clang-cl /nologo /W0 /D_CRT_SECURE_NO_WARNINGS /I include /I libs/video /Fe:test_rsx_primitives.exe libs/video/tests/test_rsx_primitives.c
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\test_rsx_primitives.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Run condition semantics regressions
        run: |
          cmake -S tests/sync_stress -B build-sync -G Ninja -DCMAKE_C_COMPILER=clang-cl -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          cmake --build build-sync --target test_cond_semantics
          ctest --test-dir build-sync -R "^cond_" --output-on-failure

      # The generated PPU sources are intentionally not stored in Git.  A private
      # second repository supplies the decrypted game ELF, and this job recreates
      # eboot_port/recompiled from that input immediately before the port build.
      # Keeping this optional preserves the generic runtime/test CI for forks and
      # PRs where repository secrets are intentionally unavailable.
      - name: Detect private game asset configuration
        id: game_assets
        shell: pwsh
        env:
          WA2_ASSETS_REPO: ${{ vars.WA2_ASSETS_REPO }}
          WA2_ASSETS_PAT: ${{ secrets.WA2_ASSETS_PAT }}
        run: |
          $enabled = -not [string]::IsNullOrWhiteSpace($env:WA2_ASSETS_REPO) -and `
                     -not [string]::IsNullOrWhiteSpace($env:WA2_ASSETS_PAT)
          "enabled=$($enabled.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if ($enabled) {
            Write-Host "Private game asset input is configured; eboot_port will be re-lifted in CI."
          } else {
            Write-Host "Private game asset input is not configured; skipping the game-port build."
          }

      - name: Checkout private game assets
        if: steps.game_assets.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.WA2_ASSETS_REPO }}
          token: ${{ secrets.WA2_ASSETS_PAT }}
          path: _private/wa2-assets
          fetch-depth: 1
          lfs: true
          persist-credentials: false

      - name: Re-lift game PPU from private EBOOT
        if: steps.game_assets.outputs.enabled == 'true'
        shell: pwsh
        env:
          WA2_EBOOT_PATH: ${{ vars.WA2_EBOOT_PATH }}
        run: |
          $relativeEboot = $env:WA2_EBOOT_PATH
          if ([string]::IsNullOrWhiteSpace($relativeEboot)) {
            $relativeEboot = "EBOOT.ELF"
          }

          $assetRoot = Join-Path $env:GITHUB_WORKSPACE "_private\wa2-assets"
          $eboot = Join-Path $assetRoot $relativeEboot
          if (-not (Test-Path -LiteralPath $eboot -PathType Leaf)) {
            throw "Private EBOOT not found at '$relativeEboot' inside the asset repository. Set repository variable WA2_EBOOT_PATH if it is not EBOOT.ELF at repo root."
          }

          $analysisDir = Join-Path $env:RUNNER_TEMP "ps3recomp-wa2-analysis"
          $recompDir = Join-Path $env:GITHUB_WORKSPACE "eboot_port\recompiled"
          Remove-Item -Recurse -Force $analysisDir -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $recompDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $analysisDir | Out-Null
          New-Item -ItemType Directory -Force -Path $recompDir | Out-Null

          Write-Host "Generating PPU metadata from private EBOOT..."
          python tools/ppu_loader.py "$eboot" -o "$analysisDir"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $functionFiles = @(Get-ChildItem -LiteralPath $analysisDir -Filter "*.functions.json" -File)
          $importFiles = @(Get-ChildItem -LiteralPath $analysisDir -Filter "*.imports.json" -File)
          if ($functionFiles.Count -ne 1) {
            throw "Expected exactly one *.functions.json from ppu_loader.py, found $($functionFiles.Count)."
          }
          if ($importFiles.Count -ne 1) {
            throw "Expected exactly one *.imports.json from ppu_loader.py, found $($importFiles.Count)."
          }

          Write-Host "Lifting PPU functions into eboot_port/recompiled..."
          python tools/ppu_lifter.py "$eboot" `
            --functions "$($functionFiles[0].FullName)" `
            --hle-stubs "$($importFiles[0].FullName)" `
            --output "$recompDir" `
            -j 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python tools/gen_hle_nids.py --all --out "$recompDir\ppu_hle_nids.cpp"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (-not (Test-Path -LiteralPath "$recompDir\ppu_recomp.h" -PathType Leaf)) {
            throw "ppu_lifter.py did not produce ppu_recomp.h"
          }
          $lifted = @(Get-ChildItem -LiteralPath $recompDir -Filter "ppu_recomp_*.cpp" -File |
            Where-Object { $_.Name -ne "ppu_hle_nids.cpp" })
          if ($lifted.Count -eq 0) {
            throw "ppu_lifter.py produced no ppu_recomp_*.cpp sources"
          }
          Write-Host "Generated $($lifted.Count) lifted PPU translation unit(s)."
          $lifted | Sort-Object Name | ForEach-Object {
            Write-Host "  $($_.Name) ($($_.Length) bytes)"
          }

      - name: Build eboot_port (Fresh re-lift)
        if: steps.game_assets.outputs.enabled == 'true'
        run: |
          cmake -S eboot_port -B eboot_port/build -G Ninja `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DPS3RECOMP_REQUIRE_FFMPEG=ON `
            -DPS3RECOMP_FFMPEG_ROOT="$env:PS3RECOMP_FFMPEG_ROOT" `
            -DPS3RECOMP_RELEASE_LIFTED_PPU_BISECT_SLICE=OFF
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build eboot_port/build
          if ($LASTEXITCODE -ne 0) { exit 1 }
          echo Copy-Item "$env:PS3RECOMP_FFMPEG_ROOT\bin\*.dll" "eboot_port\build\" -Force

      - name: Upload current fresh eboot_port Artifact
        if: steps.game_assets.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MyGameRecomp-Windows-${{ matrix.build_type }}-FreshCurrent
          path: |
            eboot_port/build/MyGameRecomp.exe
            eboot_port/build/*.dll

      # v60 pinned historical-source reproduction. The current/fresh artifact
      # above is the in-run control. For Release, restore a broad tracked
      # source/build snapshot from the explicitly chosen baseline commit using
      # python -c + git show. Never restore eboot_port/recompiled: it remains
      # generated-only and is freshly lifted from the same private EBOOT.
      - name: Restore pinned b1b1 baseline source with python -c
        if: steps.game_assets.outputs.enabled == 'true' && matrix.build_type == 'Release'
        id: historical_snapshot
        shell: pwsh
        env:
          V60_BASELINE_COMMIT: b1b1cece387a76722f0fd4e97bc953af6e37bfcd
        run: |
          git cat-file -e "$env:V60_BASELINE_COMMIT^{commit}"
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned v60 baseline commit does not exist in fetched history: $env:V60_BASELINE_COMMIT"
          }

          $py = @'
          import hashlib
          import os
          from pathlib import Path
          import subprocess
          import sys

          baseline = os.environ["V60_BASELINE_COMMIT"].strip()

          def git(*args, check=True):
              p = subprocess.run(["git", *args], stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=False)
              if check and p.returncode != 0:
                  sys.stderr.write(p.stderr.decode("utf-8", errors="replace"))
                  raise SystemExit(p.returncode)
              return p

          resolved = git("rev-parse", f"{baseline}^{{commit}}").stdout.decode().strip()
          head = git("rev-parse", "HEAD").stdout.decode().strip()

          selected_prefixes = (
              "cmake/",
              "include/",
              "runtime/",
              "libs/",
              "tools/",
              "eboot_port/",
              "templates/",
          )

          def selected(path):
              if path == "CMakeLists.txt":
                  return True
              if path.startswith("eboot_port/recompiled/"):
                  return False
              return path.startswith(selected_prefixes)

          historical_all = git("ls-tree", "-r", "--name-only", resolved).stdout.decode("utf-8", errors="replace").splitlines()
          historical = [x for x in historical_all if selected(x)]
          historical_set = set(historical)
          current = [x for x in git("ls-files").stdout.decode("utf-8", errors="replace").splitlines() if selected(x)]

          deleted = []
          for name in current:
              if name in historical_set:
                  continue
              q = Path(name)
              if q.exists() or q.is_symlink():
                  q.unlink()
                  deleted.append(name)

          restored = []
          digest = hashlib.sha256()
          for name in historical:
              blob = git("show", f"{resolved}:{name}").stdout
              q = Path(name)
              q.parent.mkdir(parents=True, exist_ok=True)
              q.write_bytes(blob)
              restored.append(name)
              digest.update(name.encode("utf-8") + b"\0")
              digest.update(hashlib.sha256(blob).digest())

          manifest = Path("av_repro_v60_pinned_b1b1.txt")
          manifest.write_text(
              "kind=v60-pinned-b1b1-historical-source-snapshot\n"
              f"head_commit={head}\n"
              f"baseline_commit={resolved}\n"
              f"restored_files={len(restored)}\n"
              f"deleted_post_baseline_files={len(deleted)}\n"
              f"snapshot_content_digest={digest.hexdigest()}\n",
              encoding="utf-8",
          )
          print(f"baseline_commit={resolved}")
          print(f"restored_files={len(restored)}")
          print(f"deleted_post_baseline_files={len(deleted)}")
          print(f"snapshot_content_digest={digest.hexdigest()}")
          '@

          python -c $py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $manifest = Get-Content av_repro_v60_pinned_b1b1.txt
          $snapshot = (($manifest | Where-Object { $_ -like 'baseline_commit=*' }) -split '=', 2)[1]
          if ([string]::IsNullOrWhiteSpace($snapshot)) { throw "v60 baseline commit missing from manifest" }
          "snapshot_commit=$snapshot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          Write-Host "v60 pinned b1b1 baseline restored runner-only."
          Get-Content av_repro_v60_pinned_b1b1.txt
          Write-Host "Working-tree changes after broad restore:"
          git status --short | Select-Object -First 200

          if (Test-Path -LiteralPath "eboot_port/recompiled") {
            Write-Host "recompiled exists only from the current fresh lift and will be deleted/re-generated next; it was not restored from Git."
          }

      - name: Install Python dependencies from v60 baseline
        if: steps.game_assets.outputs.enabled == 'true' && matrix.build_type == 'Release'
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath "tools/requirements.txt" -PathType Leaf) {
            python -m pip install -r tools/requirements.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Rebuild runtime from v60 pinned b1b1 baseline
        if: steps.game_assets.outputs.enabled == 'true' && matrix.build_type == 'Release'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
          cmake -S . -B build -G Ninja `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_BUILD_TYPE=Release `
            -DPS3RECOMP_REQUIRE_FFMPEG=ON `
            -DPS3RECOMP_FFMPEG_ROOT="$env:PS3RECOMP_FFMPEG_ROOT"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build build
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $runtimeLib = "build/ps3recomp_runtime.lib"
          if (-not (Test-Path -LiteralPath $runtimeLib -PathType Leaf)) {
            throw "v60 baseline runtime build did not produce ps3recomp_runtime.lib"
          }
          $runtimeHash = (Get-FileHash -Algorithm SHA256 $runtimeLib).Hash.ToLowerInvariant()
          "runtime_lib_sha256=$runtimeHash" | Add-Content -Path av_repro_v60_pinned_b1b1.txt -Encoding utf8
          Write-Host "v60 baseline runtime sha256=$runtimeHash"

      - name: Re-lift game PPU with v60 baseline tools
        if: steps.game_assets.outputs.enabled == 'true' && matrix.build_type == 'Release'
        shell: pwsh
        env:
          WA2_EBOOT_PATH: ${{ vars.WA2_EBOOT_PATH }}
        run: |
          $relativeEboot = $env:WA2_EBOOT_PATH
          if ([string]::IsNullOrWhiteSpace($relativeEboot)) { $relativeEboot = "EBOOT.ELF" }
          $eboot = Join-Path (Join-Path $env:GITHUB_WORKSPACE "_private\wa2-assets") $relativeEboot
          if (-not (Test-Path -LiteralPath $eboot -PathType Leaf)) { throw "Private EBOOT missing: $eboot" }

          $analysisDir = Join-Path $env:RUNNER_TEMP "ps3recomp-wa2-analysis-v60-b1b1"
          $recompDir = Join-Path $env:GITHUB_WORKSPACE "eboot_port\recompiled"
          Remove-Item -Recurse -Force $analysisDir -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $recompDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $analysisDir | Out-Null
          New-Item -ItemType Directory -Force -Path $recompDir | Out-Null

          python tools/ppu_loader.py "$eboot" -o "$analysisDir"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $functionFiles = @(Get-ChildItem -LiteralPath $analysisDir -Filter "*.functions.json" -File)
          $importFiles = @(Get-ChildItem -LiteralPath $analysisDir -Filter "*.imports.json" -File)
          if ($functionFiles.Count -ne 1 -or $importFiles.Count -ne 1) {
            throw "v60 baseline ppu_loader output is ambiguous: functions=$($functionFiles.Count), imports=$($importFiles.Count)"
          }

          python tools/ppu_lifter.py "$eboot" `
            --functions "$($functionFiles[0].FullName)" `
            --hle-stubs "$($importFiles[0].FullName)" `
            --output "$recompDir" `
            -j 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python tools/gen_hle_nids.py --all --out "$recompDir\ppu_hle_nids.cpp"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $lifted = @(Get-ChildItem -LiteralPath $recompDir -Filter "ppu_recomp_*.cpp" -File |
            Where-Object { $_.Name -ne "ppu_hle_nids.cpp" } |
            Sort-Object Name)
          if ($lifted.Count -eq 0) { throw "v60 baseline lifter produced no lifted PPU source" }

          $funcCount = 0
          foreach ($f in $lifted) {
            $funcCount += @(Select-String -LiteralPath $f.FullName -Pattern '^void func_[0-9A-Fa-f]{8}\(ppu_context\* ctx\)').Count
          }

          $digestLines = foreach ($f in $lifted) {
            $sha = (Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLowerInvariant()
            "$($f.Name):$($sha):$($f.Length)"
          }
          $digestText = ($digestLines -join "`n") + "`n"
          $digestPath = Join-Path $env:RUNNER_TEMP "v60-ppu-digest.txt"
          [System.IO.File]::WriteAllText($digestPath, $digestText, [System.Text.UTF8Encoding]::new($false))
          $ppuDigest = (Get-FileHash -Algorithm SHA256 $digestPath).Hash.ToLowerInvariant()

          Write-Host "v60 baseline lift: $($lifted.Count) TU(s), $funcCount lifted function definitions"
          $digestLines | ForEach-Object { Write-Host "  $_" }
          "historical_lifted_functions=$funcCount" | Add-Content -Path av_repro_v60_pinned_b1b1.txt -Encoding utf8
          "ppu_generated_digest=$ppuDigest" | Add-Content -Path av_repro_v60_pinned_b1b1.txt -Encoding utf8

      - name: Build eboot_port from v60 pinned b1b1 baseline
        if: steps.game_assets.outputs.enabled == 'true' && matrix.build_type == 'Release'
        shell: pwsh
        run: |
          $histBuild = "eboot_port/build-v60-b1b1-baseline"
          Remove-Item -Recurse -Force $histBuild -ErrorAction SilentlyContinue

          cmake -S eboot_port -B $histBuild -G Ninja `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_BUILD_TYPE=Release `
            -DPS3RECOMP_REQUIRE_FFMPEG=ON `
            -DPS3RECOMP_FFMPEG_ROOT="$env:PS3RECOMP_FFMPEG_ROOT"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build $histBuild
          if ($LASTEXITCODE -ne 0) { exit 1 }
          echo Copy-Item "$env:PS3RECOMP_FFMPEG_ROOT\bin\*.dll" "$histBuild\" -Force

          $exe = Join-Path $histBuild "MyGameRecomp.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "v60 baseline build produced no MyGameRecomp.exe" }
          $exeHash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          "exe_sha256=$exeHash" | Add-Content -Path av_repro_v60_pinned_b1b1.txt -Encoding utf8
          Write-Host "v60 baseline exe sha256=$exeHash"
          Get-Content av_repro_v60_pinned_b1b1.txt

      - name: Upload v60 pinned b1b1 baseline Release Artifact
        if: steps.game_assets.outputs.enabled == 'true' && matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: MyGameRecomp-Windows-Release-V60PinnedB1B1Baseline
          path: |
            eboot_port/build-v60-b1b1-baseline/MyGameRecomp.exe
            eboot_port/build-v60-b1b1-baseline/*.dll
            av_repro_v60_pinned_b1b1.txt
